<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0b0d">
<title>🛒 Compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;
    --surface:#14161a;
    --surface-2:#191c21;
    --border:#22252b;
    --accent:#ffb020;
    --text:#e8e6e1;
    --muted:#8a8f98;
    --green:#3ddc84;
    --red:#ff5470;
    --base:17px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:24px 24px;
    color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:var(--base);
    line-height:1.4;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body.f-sm{--base:15px;}
  body.f-md{--base:17px;}
  body.f-lg{--base:20px;}
  body.f-xl{--base:23px;}

  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:16px 16px calc(28px + env(safe-area-inset-bottom));
    padding-top:calc(14px + env(safe-area-inset-top));
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  header h1{
    font-size:1.5em;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85em;
    color:var(--muted);
    white-space:nowrap;
  }
  .count b{color:var(--accent);}

  /* Barra de añadir */
  .addbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    gap:8px;
    padding:10px 0 12px;
    background:linear-gradient(var(--bg) 82%, rgba(10,11,13,0));
  }
  .addbar input{
    flex:1;
    min-width:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    font-family:inherit;
    font-size:1em;
    padding:14px 16px;
    outline:none;
  }
  .addbar input::placeholder{color:var(--muted);}
  .addbar input:focus{border-color:var(--accent);}
  .addbtn{
    flex:0 0 auto;
    width:54px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#1a1204;
    font-size:1.6em;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    transition:transform .12s, filter .15s;
  }
  .addbtn:active{transform:scale(0.94);filter:brightness(1.1);}

  /* Items */
  ul{list-style:none;margin:0;padding:0;}
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:9px;
    transition:background .15s, opacity .2s, border-color .15s;
  }
  .item.done{opacity:0.55;background:var(--surface-2);}
  .check{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:8px;
    border:2px solid var(--muted);
    background:transparent;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, background .15s;
  }
  .item.done .check{border-color:var(--green);background:var(--green);}
  .check svg{width:15px;height:15px;opacity:0;transform:scale(0.6);transition:.15s;}
  .item.done .check svg{opacity:1;transform:scale(1);}
  .txt{
    flex:1;
    min-width:0;
    font-size:1em;
    word-break:break-word;
    cursor:pointer;
    user-select:none;
  }
  .item.done .txt{text-decoration:line-through;color:var(--muted);}
  .qty{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .qbtn{
    width:30px;height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:1.1em;font-weight:600;
    line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qbtn:active{background:var(--border);}
  .qnum{
    min-width:22px;text-align:center;
    font-size:0.95em;color:var(--accent);font-weight:600;
  }
  .item.done .qnum{color:var(--muted);}
  .del{
    flex:0 0 auto;
    width:34px;height:34px;
    border:none;background:transparent;
    color:var(--muted);
    font-size:1.4em;line-height:1;cursor:pointer;
    border-radius:8px;
  }
  .del:active{color:var(--red);background:var(--surface-2);}

  .divider{
    display:flex;align-items:center;gap:10px;
    margin:20px 2px 12px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78em;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;background:var(--border);
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:48px 20px;
    font-size:0.95em;
  }
  .empty .big{font-size:2.4em;margin-bottom:8px;}

  /* Pie de acciones */
  .footer{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .row-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72em;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin:0 2px 8px;
  }
  .seg{
    display:flex;gap:8px;margin-bottom:16px;
  }
  .seg button{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:12px;
    padding:12px 4px;
    font-family:inherit;font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .seg button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1204;
  }
  .seg button.s1{font-size:14px;}
  .seg button.s2{font-size:17px;}
  .seg button.s3{font-size:20px;}
  .seg button.s4{font-size:23px;}

  .actions{display:flex;gap:8px;}
  .ghost{
    flex:1;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:12px;
    padding:13px 8px;
    font-family:inherit;font-size:0.9em;font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .ghost:active{background:var(--surface);}
  .ghost.danger:active{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>La compra</h1>
      <div class="count"><b id="pendCount">0</b> por comprar</div>
    </header>

    <div class="addbar">
      <input id="newItem" type="text" placeholder="Añadir producto…" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
      <button class="addbtn" id="addBtn" aria-label="Añadir">+</button>
    </div>

    <ul id="pending"></ul>

    <div id="doneWrap" style="display:none">
      <div class="divider">Comprado</div>
      <ul id="done"></ul>
    </div>

    <div id="empty" class="empty">
      <div class="big">🛒</div>
      La lista está vacía.<br>Escribe arriba lo que necesites.
    </div>

    <div class="footer">
      <div class="row-label">Tamaño de la letra</div>
      <div class="seg" id="sizeSeg">
        <button class="s1" data-size="f-sm">A</button>
        <button class="s2" data-size="f-md">A</button>
        <button class="s3" data-size="f-lg">A</button>
        <button class="s4" data-size="f-xl">A</button>
      </div>
      <div class="actions">
        <button class="ghost" id="clearDone">Borrar comprados</button>
        <button class="ghost danger" id="clearAll">Vaciar todo</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var KEY = "listacompra_estado_v1";
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  var state = { items: [], size: "f-md" };

  // ---- Persistencia ----
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && Array.isArray(p.items)) state.items = p.items;
        if(p && typeof p.size === "string") state.size = p.size;
      }
    }catch(e){ /* si hay basura, empezamos limpio */ }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  // ---- Utilidades ----
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function addItem(text){
    var t = (text || "").trim();
    if(!t) return;
    state.items.unshift({ id: uid(), text: t, qty: 1, done: false });
    save();
    render();
  }
  function removeItem(id){
    state.items = state.items.filter(function(it){ return it.id !== id; });
    save(); render();
  }
  function toggleItem(id){
    state.items.forEach(function(it){ if(it.id===id) it.done = !it.done; });
    save(); render();
  }
  function changeQty(id, delta){
    state.items.forEach(function(it){
      if(it.id===id){
        it.qty = Math.max(1, (it.qty||1) + delta);
      }
    });
    save(); render();
  }

  // ---- Render ----
  var $pending = document.getElementById("pending");
  var $done = document.getElementById("done");
  var $doneWrap = document.getElementById("doneWrap");
  var $empty = document.getElementById("empty");
  var $count = document.getElementById("pendCount");

  function buildRow(it){
    var li = document.createElement("li");
    li.className = "item" + (it.done ? " done" : "");

    var check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-label", it.done ? "Desmarcar" : "Marcar como comprado");
    check.innerHTML = CHECK_SVG;
    check.addEventListener("click", function(){ toggleItem(it.id); });

    var txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = it.text;
    txt.addEventListener("click", function(){ toggleItem(it.id); });

    li.appendChild(check);
    li.appendChild(txt);

    if(!it.done){
      var qty = document.createElement("div");
      qty.className = "qty";
      var minus = document.createElement("button");
      minus.className = "qbtn"; minus.textContent = "−";
      minus.setAttribute("aria-label","Menos cantidad");
      minus.addEventListener("click", function(){ changeQty(it.id, -1); });
      var num = document.createElement("span");
      num.className = "qnum"; num.textContent = it.qty || 1;
      var plus = document.createElement("button");
      plus.className = "qbtn"; plus.textContent = "+";
      plus.setAttribute("aria-label","Más cantidad");
      plus.addEventListener("click", function(){ changeQty(it.id, 1); });
      qty.appendChild(minus); qty.appendChild(num); qty.appendChild(plus);
      li.appendChild(qty);
    } else {
      if((it.qty||1) > 1){
        var qn = document.createElement("span");
        qn.className = "qnum"; qn.style.marginRight = "4px";
        qn.textContent = "×" + it.qty;
        li.appendChild(qn);
      }
    }

    var del = document.createElement("button");
    del.className = "del"; del.textContent = "×";
    del.setAttribute("aria-label","Eliminar");
    del.addEventListener("click", function(){ removeItem(it.id); });
    li.appendChild(del);

    return li;
  }

  function render(){
    $pending.innerHTML = "";
    $done.innerHTML = "";
    var pend = state.items.filter(function(it){ return !it.done; });
    var comp = state.items.filter(function(it){ return it.done; });

    pend.forEach(function(it){ $pending.appendChild(buildRow(it)); });
    comp.forEach(function(it){ $done.appendChild(buildRow(it)); });

    $doneWrap.style.display = comp.length ? "block" : "none";
    $empty.style.display = state.items.length ? "none" : "block";
    $count.textContent = pend.length;
  }

  // ---- Tamaño de fuente ----
  var sizeBtns = document.querySelectorAll("#sizeSeg button");
  function applySize(){
    document.body.classList.remove("f-sm","f-md","f-lg","f-xl");
    document.body.classList.add(state.size);
    sizeBtns.forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-size") === state.size);
    });
  }
  sizeBtns.forEach(function(b){
    b.addEventListener("click", function(){
      state.size = b.getAttribute("data-size");
      applySize(); save();
    });
  });

  // ---- Eventos de añadir ----
  var $new = document.getElementById("newItem");
  document.getElementById("addBtn").addEventListener("click", function(){
    addItem($new.value); $new.value = ""; $new.focus();
  });
  $new.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ addItem($new.value); $new.value = ""; }
  });

  // ---- Botones de limpieza ----
  document.getElementById("clearDone").addEventListener("click", function(){
    var comp = state.items.filter(function(it){ return it.done; });
    if(!comp.length) return;
    if(confirm("¿Borrar los " + comp.length + " productos ya comprados?")){
      state.items = state.items.filter(function(it){ return !it.done; });
      save(); render();
    }
  });
  document.getElementById("clearAll").addEventListener("click", function(){
    if(!state.items.length) return;
    if(confirm("¿Vaciar toda la lista?")){
      state.items = []; save(); render();
    }
  });

  // ---- Init ----
  load();
  applySize();
  render();
})();
</script>
</body>
</html>
